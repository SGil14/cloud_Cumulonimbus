# Prometheus para `docker compose`: lee /metrics de la API cada 10 segundos.
# Las etiquetas «componente» y «pod» son las mismas que pone Kubernetes, así el mismo dashboard sirve en ambos.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: cumulonimbus
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          componente: cumulonimbus-api
          pod: app
