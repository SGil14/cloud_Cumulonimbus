<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="520" fill="#ffffff"/>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
  </defs>

  <!-- Usuario y servicios externos -->
  <rect x="20" y="40" width="150" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="95" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Navegador</text>
  <text x="95" y="90" text-anchor="middle" font-size="12" fill="#475569">computador o celular</text>

  <rect x="20" y="380" width="150" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="95" y="405" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Servicios externos</text>
  <text x="95" y="425" text-anchor="middle" font-size="12" fill="#475569">SAB / IDIGER (lluvia)</text>
  <text x="95" y="442" text-anchor="middle" font-size="12" fill="#475569">IDECA · Nominatim</text>
  <text x="95" y="459" text-anchor="middle" font-size="12" fill="#475569">Valhalla (rutas)</text>

  <!-- Grupo de recursos -->
  <rect x="215" y="15" width="665" height="490" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="6 4"/>
  <text x="235" y="42" font-size="16" font-weight="700" fill="#1d4ed8">rg-cumulonimbus · Central US</text>
  <text x="235" y="62" font-size="12" fill="#1e40af">etiqueta proyecto=cumulonimbus en todos los recursos</text>

  <!-- Entorno -->
  <rect x="240" y="85" width="330" height="200" rx="12" fill="#ffffff" stroke="#60a5fa"/>
  <text x="255" y="108" font-size="13" font-weight="600" fill="#1d4ed8">cae-cumulonimbus (entorno Container Apps)</text>
  <rect x="260" y="125" width="290" height="140" rx="10" fill="#dbeafe" stroke="#2563eb"/>
  <text x="405" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">ca-cumulonimbus</text>
  <text x="405" y="172" text-anchor="middle" font-size="12" fill="#1e293b">FastAPI + frontend React compilado</text>
  <text x="405" y="190" text-anchor="middle" font-size="12" fill="#1e293b">recolector del SAB cada 5 minutos</text>
  <text x="405" y="212" text-anchor="middle" font-size="12" fill="#1e293b">0,5 vCPU · 1 GiB · 1 réplica fija</text>
  <text x="405" y="234" text-anchor="middle" font-size="12" fill="#1e293b">alembic upgrade head al arrancar</text>
  <text x="405" y="254" text-anchor="middle" font-size="11" fill="#475569">HTTPS público · puerto 8000</text>

  <!-- Base de datos -->
  <rect x="240" y="330" width="330" height="90" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="405" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">psql-cumulonimbus-8995</text>
  <text x="405" y="378" text-anchor="middle" font-size="12" fill="#1e293b">PostgreSQL 16 · B1ms · base lluvia_bogota</text>
  <text x="405" y="398" text-anchor="middle" font-size="11" fill="#475569">SSL obligatorio · solo servicios de Azure</text>

  <!-- Columna derecha -->
  <rect x="620" y="85" width="240" height="70" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="740" y="112" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">acrcumulonimbus8995</text>
  <text x="740" y="132" text-anchor="middle" font-size="12" fill="#1e293b">registro · imagen cumulonimbus:v1</text>

  <rect x="620" y="180" width="240" height="70" rx="10" fill="#fce7f3" stroke="#db2777"/>
  <text x="740" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">kv-cumulonimbus-8995</text>
  <text x="740" y="227" text-anchor="middle" font-size="12" fill="#1e293b">Key Vault · database-url</text>

  <rect x="620" y="275" width="240" height="70" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="740" y="302" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">id-cumulonimbus</text>
  <text x="740" y="322" text-anchor="middle" font-size="12" fill="#1e293b">identidad · AcrPull + leer secretos</text>

  <rect x="620" y="370" width="240" height="70" rx="10" fill="#f1f5f9" stroke="#64748b"/>
  <text x="740" y="397" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">log-cumulonimbus</text>
  <text x="740" y="417" text-anchor="middle" font-size="12" fill="#1e293b">Log Analytics · logs 30 días</text>

  <!-- Flechas -->
  <line x1="170" y1="75" x2="258" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <text x="182" y="132" font-size="11" fill="#475569">HTTPS</text>
  <line x1="405" y1="265" x2="405" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <text x="412" y="302" font-size="11" fill="#475569">SQL con SSL</text>
  <line x1="260" y1="240" x2="172" y2="400" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <line x1="618" y1="120" x2="552" y2="150" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <text x="560" y="128" font-size="11" fill="#475569">imagen</text>
  <line x1="618" y1="215" x2="552" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#f)"/>
  <text x="572" y="200" font-size="11" fill="#475569">secreto</text>
  <line x1="552" y1="250" x2="618" y2="395" stroke="#475569" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#f)"/>
  <text x="590" y="350" font-size="11" fill="#475569">logs</text>
</svg>
