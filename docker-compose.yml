# Cumulonimbus con Docker: la aplicación y su base de datos PostgreSQL.
#
#   1. Define POSTGRES_PASSWORD en el archivo .env (solo letras y números, sin símbolos).
#   2. docker compose up --build
#   3. Abre http://localhost:8000
#
# Monitoreo (también arranca con `docker compose up`):
#   Grafana     http://localhost:3000   usuario admin y la contraseña GRAFANA_PASSWORD del .env
#   Prometheus  http://localhost:9090   lee http://app:8000/metrics cada 10 segundos
# El dashboard «Cumulonimbus · API e IA» ya viene cargado (monitoreo/grafana/dashboards/cumulonimbus.json).
#
# Los datos de PostgreSQL se guardan en el volumen "datos_postgres": sobreviven a reinicios y a "docker compose down".
# Para borrarlos también: docker compose down -v

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lluvia_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: lluvia_bogota
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lluvia_app -d lluvia_bogota"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://lluvia_app:${POSTGRES_PASSWORD}@db:5432/lluvia_bogota
      RECOLECTOR_ACTIVO: "true"
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      - app
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoreo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - datos_prometheus:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Define GRAFANA_PASSWORD en el archivo .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoreo/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoreo/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - datos_grafana:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  datos_postgres:
  datos_prometheus:
  datos_grafana:
