# Cumulonimbus con Docker: la aplicación y su base de datos PostgreSQL.
#
#   1. Define POSTGRES_PASSWORD en el archivo .env (solo letras y números, sin símbolos).
#   2. docker compose up --build
#   3. Abre http://localhost:8000
#
# Los datos de PostgreSQL se guardan en el volumen "datos_postgres": sobreviven a reinicios y a "docker compose down".
# Para borrarlos también: docker compose down -v

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lluvia_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: lluvia_bogota
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lluvia_app -d lluvia_bogota"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://lluvia_app:${POSTGRES_PASSWORD}@db:5432/lluvia_bogota
      RECOLECTOR_ACTIVO: "true"
    ports:
      - "8000:8000"

volumes:
  datos_postgres:
