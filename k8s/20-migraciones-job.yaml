# Job que crea o actualiza las tablas (alembic upgrade head) una sola vez por despliegue.
# Se hace aparte para que las réplicas de la API no corran las migraciones al mismo tiempo.
# Para repetirlo tras un cambio de esquema:
#   kubectl delete job migraciones -n cumulonimbus && kubectl apply -f k8s/20-migraciones-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: migraciones
  namespace: cumulonimbus
spec:
  backoffLimit: 6          # reintenta mientras PostgreSQL termina de arrancar
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: alembic
          image: cumulonimbus:latest
          imagePullPolicy: IfNotPresent
          workingDir: /app/backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: cumulonimbus-config }
            - secretRef: { name: cumulonimbus-secretos }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
