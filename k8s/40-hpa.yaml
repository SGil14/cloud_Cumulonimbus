# Autoescalado horizontal de la API: entre 2 y 6 réplicas según el uso de CPU.
# Requiere metrics-server en el clúster (ver README · Kubernetes · Autoescalado).
# Para verlo en acción:  kubectl get hpa -n cumulonimbus -w   mientras corre scripts/trafico.py
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: cumulonimbus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60   # % de resources.requests.cpu (100m)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # baja rápido después de la demo
