# EJEMPLO del Secret con las credenciales. El archivo real NO se sube al repositorio.
#
# Opción 1 (recomendada): crearlo directo con kubectl, sin escribir la contraseña en ningún archivo:
#   kubectl create secret generic cumulonimbus-secretos -n cumulonimbus \
#     --from-literal=POSTGRES_PASSWORD=<una-contraseña> \
#     --from-literal=DATABASE_URL=postgresql+psycopg://lluvia_app:<una-contraseña>@postgres:5432/lluvia_bogota \
#     --from-literal=JWT_SECRET_KEY=<texto-aleatorio-de-32-caracteres-o-mas>
#   Generar una llave:  python -c "import secrets; print(secrets.token_urlsafe(48))"
#
# Opción 2: copiar este archivo a secret.yaml (está en .gitignore), cambiar los valores y aplicarlo.
#
# Aquí también van las llaves de los otros componentes del Proyecto 3 (firma de tokens JWT,
# clave de la API de IA), para que nunca queden escritas en el código.
apiVersion: v1
kind: Secret
metadata:
  name: cumulonimbus-secretos
  namespace: cumulonimbus
type: Opaque
stringData:
  POSTGRES_PASSWORD: "cambia-esta-clave"
  DATABASE_URL: "postgresql+psycopg://lluvia_app:cambia-esta-clave@postgres:5432/lluvia_bogota"
  # Llave con la que la API firma los tokens de inicio de sesión (JWT). Si se pierde o cambia,
  # todas las sesiones abiertas dejan de valer. Mínimo 16 caracteres; usa una larga y aleatoria.
  JWT_SECRET_KEY: "cambia-esta-llave-por-una-larga-y-aleatoria"
  # (Opcional) Correo que, al registrarse, queda como administrador.
  # ADMIN_CORREO: "tu-correo@ejemplo.com"
---
# Contraseña del usuario admin de Grafana (namespace de monitoreo).
#   kubectl create secret generic grafana-admin -n monitoreo \
#     --from-literal=admin-user=admin --from-literal=admin-password=<una-contraseña>
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoreo
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "cambia-esta-clave"
